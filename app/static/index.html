<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Local Chat</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Chat controls">
        <a class="brand" href="/" aria-label="Local Chat home">Local Chat</a>
        <button class="new-chat" id="new-chat" type="button">+ New chat</button>
        <nav class="conversation-list" id="conversation-list" aria-label="Saved conversations"></nav>
        <p class="sidebar-note">Conversations stay on this device.</p>
      </aside>
      <main class="chat-panel">
        <header class="topbar">
          <div><p class="eyebrow">Single-user workspace</p><h1>New conversation</h1></div>
          <span class="connection" id="connection-status">Ready</span>
        </header>
        <section class="conversation" id="messages" aria-live="polite" aria-label="Conversation">
          <div class="empty-state" id="empty-state">
            <p class="eyebrow">Start here</p>
            <h2>What would you like to work on?</h2>
            <p>Ask a question, draft something, or explore an idea.</p>
            <div class="suggestions" aria-label="Example prompts">
              <button type="button" data-prompt="Help me plan my day.">Plan my day</button>
              <button type="button" data-prompt="Explain this topic simply: ">Explain a topic</button>
              <button type="button" data-prompt="Help me write a clear email about ">Write an email</button>
            </div>
          </div>
        </section>
        <form class="composer" id="chat-form">
          <label class="sr-only" for="message">Message</label>
          <textarea id="message" required maxlength="12000" rows="1" placeholder="Message Local Chat" aria-describedby="composer-help"></textarea>
          <div class="composer-footer">
            <span id="composer-help">Enter to send · Shift+Enter for a new line</span>
            <button id="send-button" type="submit">Send <span aria-hidden="true">↵</span></button>
          </div>
        </form>
      </main>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
